[project]
name = "txt2srt"
version = "0.5.1"
description = "Forced alignment of a corrected transcript to its recording: exact text in, timed SRT out"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["forced-alignment", "subtitles", "srt", "whisper", "japanese"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    # FFmpeg's libav* in-process, so a source install needs no ffmpeg binary on
    # PATH. The Homebrew build deliberately leaves this out and depends on the
    # ffmpeg formula instead: PyAV's wheel bundles ad-hoc signed dylibs, and
    # Homebrew's install-name rewriting invalidates those signatures, after which
    # macOS kills the process on import with a bare SIGKILL. txt2srt.audio falls
    # back to the ffmpeg binary when PyAV is missing, so both installs decode.
    "av>=15.0.0",
    # Used by every backend for the emission/energy arrays. Capped for the same
    # reason as mlx-asr: mlx-whisper pulls numba, and numba caps numpy<2.5.
    "numpy<2.5",
    # Runs the bundled Silero VAD weights. Speech detection is not optional:
    # cue snapping, --report and the vad backend all rest on knowing where
    # somebody is speaking, and an energy threshold does not know that. The CPU
    # wheel is deliberate, for the same reason there is no torch here.
    "onnxruntime>=1.16",
]

[project.scripts]
txt2srt = "txt2srt.cli:cli"

[project.optional-dependencies]
# The default backend. mlx-whisper only: deliberately no torch, which is what
# keeps a Homebrew formula possible at all (see the tap formula's comments).
whisper = [
    "mlx-whisper>=0.4.3",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["txt2srt"]
